<template>
    <lightning-card title="Property Location">
        <div class="slds-p-around_medium">
            <template if:true={hasMarkers}>
                <lightning-map
                    map-markers={mapMarkers}
                    zoom-level={zoomLevel}
                    show-footer>
                </lightning-map>
            </template>
            <template if:false={hasMarkers}>
                <p class="slds-text-align_center">
                    No address available to show on map.
                </p>
            </template>
        </div>
    </lightning-card>
</template>
